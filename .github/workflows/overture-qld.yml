name: Build Queensland web-business list

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1'

permissions:
  contents: write

jobs:
  build-list:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DuckDB
        run: python -m pip install --upgrade duckdb

      - name: Query Overture Maps
        run: python scripts/overture_qld.py

      - name: Commit refreshed CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/qld_web_candidates.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh Queensland Overture candidates"
            git push
          fi
